<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>390×844 검증용 (임시)</title>
<style>
  html,body{margin:0;background:#20242a;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:18px;padding:16px;align-items:flex-start}
  .device{width:390px;height:844px;border:1px solid #444;border-radius:8px;overflow:hidden;background:#fff;flex:0 0 auto}
  .device iframe{width:390px;height:844px;border:0;display:block}
  .side{color:#cbd2da;font-size:12px;line-height:1.6;max-width:420px}
  .side b{color:#fff}
  .side a{color:#8fd0ff}
  .side ul{padding-left:16px;margin:6px 0}
  .side code{color:#ffd18a}
</style>
</head>
<body>
<div class="wrap">
  <div class="device"><iframe id="f" src="./index.html" title="다낭 사이트 390x844 미리보기"></iframe></div>
  <div class="side">
    <p><b>390×844 검증용 임시 페이지</b> (확인 후 삭제)</p>
    <ul>
      <li><a href="./index.html" target="_blank" rel="noopener">사이트 새 창으로</a></li>
      <li>보기: <code id="v">—</code> · 스크롤: <code id="y">—</code></li>
      <li>탭: <span id="tablist">—</span></li>
      <li>오류: <span id="err">—</span></li>
      <li>카드 / 장소카드: <span id="cards">—</span></li>
      <li>지도 캔버스: <span id="mapok">—</span></li>
      <li>스크롤 높이: <span id="h">—</span></li>
    </ul>
    <p>주소에 <code>?v=food|map|tips|all|d1..d5&amp;y=숫자</code>를 붙이면 그 화면·스크롤 위치로 엽니다.</p>
  </div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const v = qs.get('v') || 'all';
const y = parseInt(qs.get('y') || '0', 10);
const f = document.getElementById('f');
f.src = './index.html' + (v ? '#' + v : '');
document.getElementById('v').textContent = v;
document.getElementById('y').textContent = y;
f.addEventListener('load', () => {
  setTimeout(() => {
    let d;
    try { d = f.contentDocument; } catch (e) { document.getElementById('err').textContent = 'cross-origin'; return; }
    if (!d) return;
    if (y > 0) f.contentWindow.scrollTo(0, y);
    const check = () => {
      document.getElementById('err').textContent = d.documentElement.getAttribute('data-err') || '없음';
      document.getElementById('cards').textContent = d.querySelectorAll('.card').length + ' / ' + d.querySelectorAll('.rcard').length;
      document.getElementById('tablist').textContent = [...d.querySelectorAll('.tab[aria-selected="true"]')].map(t => t.textContent.trim()).join(',');
      document.getElementById('h').textContent = d.documentElement.scrollHeight + 'px';
      const mc = d.querySelector('#mapcanvas .leaflet-container, #mapcanvas .leaflet-pane');
      document.getElementById('mapok').textContent = mc ? '표시됨' : (d.querySelector('#mapcanvas') ? '없음' : '해당 없음');
    };
    check();
    setTimeout(check, 1500);
  }, 700);
});
</script>
</body>
</html>
