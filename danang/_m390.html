<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>390×844 검증용 (임시)</title>
<style>
  html,body{margin:0;background:#20242a;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:18px;padding:16px;align-items:flex-start}
  .device{width:390px;height:844px;border:1px solid #444;border-radius:8px;overflow:hidden;background:#fff;flex:0 0 auto}
  .device iframe{width:390px;height:844px;border:0;display:block}
  .side{color:#cbd2da;font-size:12px;line-height:1.6;max-width:420px}
  .side b{color:#fff}
  .side a{color:#8fd0ff}
  .side ul{padding-left:16px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="device"><iframe id="f" src="./index.html" title="다낭 사이트 390x844 미리보기"></iframe></div>
  <div class="side">
    <p><b>390×844 검증용 임시 페이지</b> (확인 후 삭제)</p>
    <ul>
      <li><a href="./index.html" target="_blank" rel="noopener">사이트 새 창으로</a></li>
      <li>탭: <span id="tablist">—</span></li>
      <li>오류: <span id="err">—</span></li>
      <li>카드 수: <span id="cards">—</span></li>
      <li>스크롤 높이: <span id="h">—</span></li>
    </ul>
    <p>아이프레임이 로드되면 위 값을 채웁니다.</p>
  </div>
</div>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const check = () => {
    let d;
    try { d = f.contentDocument; } catch (e) { document.getElementById('err').textContent = 'cross-origin'; return; }
    if (!d) return;
    document.getElementById('err').textContent = d.documentElement.getAttribute('data-err') || '없음';
    document.getElementById('cards').textContent = d.querySelectorAll('.card').length;
    document.getElementById('tablist').textContent = [...d.querySelectorAll('.tab')].map(t => t.textContent.trim()).join(' / ');
    document.getElementById('h').textContent = d.documentElement.scrollHeight + 'px';
  };
  setTimeout(check, 1200);
});
</script>
</body>
</html>
