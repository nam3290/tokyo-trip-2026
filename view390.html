<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>390x844 검증 — 2일차</title>
<style>
  html,body{margin:0;padding:0;background:#d9d9d9}
  .wrap{width:390px;height:844px;margin:0 auto;overflow:hidden;background:#fff}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="wrap"><iframe id="f" src="./index.html#d2"></iframe></div>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      if (!/d2/.test(d.location.hash)) d.location.hash = '#d2';
    } catch (e) {}
  });
</script>
</body>
</html>
